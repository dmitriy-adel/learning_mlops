version: 3.9

services: 
  api:
    build: ./app
    container_name: api_service
    ports:
      - ":"
    depends_on:
      - db
      - cache

    environment:
      - DB_URL=
      - REDIS_HOST=
      - REDIS_PROT=

  db:
    image: postgres:15
    container_name: psql_container
    environment:
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
    volumes:
      - 
    ports:
      - "5432:5432"

  cache:
    image: redis:latest
    container_name: cache_container
    ports:
      - "6379:6379"

volumes:
  db_data:
    driver: local
